name: News takes

on:
  schedule:
    - cron: "41 * * * *"     # hourly; GitHub often starts scheduled runs late, which is fine for news
  workflow_dispatch:
  # GitHub often starts the hourly schedule hours late, so also refresh right after every nightly run
  workflow_run:
    workflows: ["Nightly NHL pull"]
    types: [completed]

permissions:
  contents: write

# its own group: sharing the nightly's group would let a queued news run cancel a waiting nightly run
concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # main as it is now, not the commit that triggered the run: scheduled and workflow_run runs otherwise start
      # from a stale commit, rewrite files the previous run already pushed, and the rebase below conflicts
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Claude SDK
        run: pip install "anthropic>=0.40"

      - name: Gather news, newsletters, podcasts and videos, and what's being said about every player; write takes (about 1 cent each, 8 per run at most)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STORY_MODEL: claude-sonnet-5-5
          NEWS_MAX: "8"
          # optional: a free YouTube Data API key, used only when YouTube's channel feeds fail
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/write_news.py

      - name: Save them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data/news data/injuries data/coverage; do if [ -e "$p" ]; then git add "$p"; fi; done
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "News $(date -u +%Y-%m-%dT%H:%MZ)"
          # this job is the only writer of data/news, data/coverage and data/injuries/history.json, so on a conflict its own,
          # newer files win (-X theirs keeps the commit being replayed); a failed rebase is aborted before retrying
          for i in 1 2 3; do
            if git pull -q --rebase -X theirs origin main && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
