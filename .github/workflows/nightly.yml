name: Nightly NHL pull

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC = 4:17 AM Denver (MDT), after every game ends
    - cron: "37 20 * * *"   # 2:37 PM Denver: rebuild the site so tonight's page reflects late lineup news
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nhl-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26 on Oct 19
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download finished games and rebuild tables
        run: python scripts/fetch.py

      - name: Download MoneyPuck shots and NHL Edge tracking
        continue-on-error: true
        run: python scripts/fetch_external.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Data through $(date -u +%Y-%m-%d)"
            git pull -q --rebase origin main   # the hourly news job may have pushed in the meantime
            git push
          fi

  site:
    needs: pull
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26 on Oct 19
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # the commit the pull job just pushed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install analysis libraries
        run: pip install -r requirements.txt

      - name: Run the models
        run: |
          python analysis/player_flags.py
          python analysis/onice.py
          python analysis/props_data.py 20252026
          python analysis/props_data.py 20262027

      - name: Check shift-derived ice time against the NHL's official report
        continue-on-error: true
        run: python analysis/validate_toi.py

      - name: Build site data
        env:
          FANTASY_PASSWORD: ${{ secrets.FANTASY_PASSWORD }}   # encrypts My team; without it that page isn't published
        run: python site/build.py

      - name: Write recaps and previews with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STORY_MODEL: claude-sonnet-5-5
          STORY_MAX: "130"          # spending cap per run; a normal night writes 10-30
        run: python scripts/write_stories.py

      - name: Write the weekly column and deep dives with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STORY_MODEL: claude-sonnet-5-5
          FEATURE_MAX: "3"          # at most one scheduled piece a night, plus up to two requests
        run: python scripts/write_features.py

      - name: Save stories and the pre-game archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # stories, features and the frozen pre-game prices; data/injuries belongs to the hourly news job (avoids rebase conflicts)
          for p in data/stories data/archive data/features; do if [ -e "$p" ]; then git add "$p"; fi; done
          if ! git diff --cached --quiet; then
            git commit -q -m "Stories and pre-game archive $(date -u +%Y-%m-%d)"
            # anything else the build touched in tracked files is not ours to commit; drop it so the rebase can run
            git checkout -- .
            git pull -q --rebase origin main
            git push -q
          fi

      - name: Stage only the public files
        run: |
          # the page, its scripts and the built data; never config.json (roster) or the Python sources
          mkdir -p _site
          cp site/index.html site/style.css site/*.js _site/
          cp -r site/data _site/data
          rm -f _site/data/fantasy.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
