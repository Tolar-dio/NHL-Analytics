name: Nightly NHL pull

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC = 4:17 AM Denver (MDT), after every game ends
    - cron: "37 20 * * *"   # 2:37 PM Denver: rebuild the site so tonight's page reflects late lineup news
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nhl-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download finished games and rebuild tables
        run: python scripts/fetch.py

      - name: Download MoneyPuck shots and NHL Edge tracking
        continue-on-error: true
        run: python scripts/fetch_external.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Data through $(date -u +%Y-%m-%d)"
            git push
          fi

  site:
    needs: pull
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # the commit the pull job just pushed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install analysis libraries
        run: pip install -r requirements.txt

      - name: Run the models
        run: |
          python analysis/player_flags.py
          python analysis/onice.py
          python analysis/props_data.py 20252026
          python analysis/props_data.py 20262027

      - name: Build site data
        run: python site/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
